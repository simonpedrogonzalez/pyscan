name: Build & publish wheels

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload the built wheels to PyPI?"
        type: boolean
        required: false
        default: false

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, macos-13, windows-2022, macos-14]
    env:
      CIBW_BUILD: "cp3*-*"
      CIBW_SKIP: "pp* *-musllinux*"
      CIBW_TEST_SKIP: "*"
      CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
      CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
      CIBW_ENVIRONMENT_MACOS: "MACOSX_DEPLOYMENT_TARGET=10.13"
      CIBW_BEFORE_ALL_LINUX: |
        if command -v dnf >/dev/null; then
          dnf install -y 'dnf-command(config-manager)'
          dnf config-manager --set-enabled crb
          dnf install -y epel-release
          dnf install -y boost-devel gsl-devel CGAL-devel
        else
          yum install -y epel-release
          yum-config-manager --enable epel
          yum install -y boost-devel gsl-devel CGAL-devel || \
            { echo "CGAL-devel not found on EL7; exit"; exit 1; }
        fi
      CIBW_BEFORE_ALL_MACOS: >-
        brew update && brew install boost cgal gsl
      CIBW_BEFORE_ALL_WINDOWS: >-
        vcpkg install boost:x64-windows gsl:x64-windows cgal:x64-windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip cibuildwheel~=2.21 build

      # build wheels
      - run: python -m cibuildwheel --output-dir wheelhouse

      # make a source distribution once
      - if: matrix.os == 'ubuntu-22.04'
        run: python -m build --sdist --outdir wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*

  publish:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheels-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@v1
        with:
          packages-dir: dist
          password: ${{ secrets.PYPI_API_TOKEN }}
