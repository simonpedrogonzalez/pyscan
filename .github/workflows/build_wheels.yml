name: Build & publish wheels

on:
  # push:
  #   branches: [ master ]          # build every push
  # pull_request:                 # build every PR
  # release:                      # publish only when you create a GitHub Release
  #   types: [published]
  workflow_dispatch:            # manual trigger

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, macos-13, windows-2022, macos-14]
    env:
      CIBW_BUILD: "cp3*-*"
      CIBW_SKIP: "pp* *-musllinux*"
      CIBW_TEST_SKIP: "*"
      CIBW_BEFORE_ALL_LINUX: >-
        yum install -y boost-devel CGAL-devel gsl-devel
      CIBW_BEFORE_ALL_MACOS: >-
        brew update && brew install boost cgal gsl
      CIBW_BEFORE_ALL_WINDOWS: >-
        choco install -y boost-msvc gsl &&
        vcpkg install cgal
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip cibuildwheel~=2.21 build

      # build wheels
      - run: python -m cibuildwheel --output-dir wheelhouse

      # make a source distribution once
      - if: matrix.os == 'ubuntu-22.04'
        run: python -m build --sdist --outdir wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*

  publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheels-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@v1
        with:
          packages-dir: dist
          password: ${{ secrets.PYPI_API_TOKEN }}
